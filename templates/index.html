<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="csrf-token" content="{{ csrf_token }}">
    <title>Assistive system for Blind Users</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f8f9fa;
            font-family: Arial, sans-serif;
        }
        .container {
            max-width: 600px;
            margin-top: 50px;
        }
        .video-container {
            text-align: center;
            margin-bottom: 20px;
        }
        video {
            width: 100%;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
        }
        .btn-custom {
            width: 100%;
            padding: 10px;
            font-size: 18px;
        }
        .response-box {
            background-color: #ffffff;
            border: 1px solid #ddd;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>

<div class="container text-center">
    <h2 class="mb-4 text-primary">Assistive system for Blind</h2>

    <!-- Camera Preview -->
    <div class="video-container">
        <video id="video" autoplay></video>
    </div>

    <!-- Hidden Canvas -->
    <canvas id="canvas" style="display: none;"></canvas>

    <!-- Capture Button (For Manual Capture) -->
    <button id="capture-btn" class="btn btn-danger btn-custom">Capture Image</button>

    <p id="status" class="mt-3 text-secondary">Say "Capture Image" to take a picture.</p>

    <!-- AI Response Section -->
    <div class="response-box mt-4">
        <h5 class="text-success">Response:</h5>
        <p id="response" class="text-dark">Waiting for input...</p>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<!-- JavaScript for Camera & Speech Recognition -->
<script>
    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const captureBtn = document.getElementById("capture-btn");

    // Start Camera Automatically
    navigator.mediaDevices.getUserMedia({ video: true })
        .then(stream => {
            video.srcObject = stream;
        })
        .catch(error => console.error("Error accessing camera:", error));

    // Speech Recognition
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    const recognition = new SpeechRecognition();
    recognition.continuous = true;
    recognition.lang = "en-US";

    recognition.onresult = function(event) {
        const speechText = event.results[event.results.length - 1][0].transcript.toLowerCase();
        console.log("Heard:", speechText);
        if (speechText.includes("capture image")) {
            captureImage();
        } else {
            askQuestion(speechText);
        }
    };

    // Start Listening for Voice Commands
    recognition.start();

    // Function to Capture Image
    function captureImage() {
        const context = canvas.getContext("2d");
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        context.drawImage(video, 0, 0, canvas.width, canvas.height);

        canvas.toBlob((blob) => {
            let formData = new FormData();
            formData.append("image", blob, "image.jpg");

            fetch("/capture-image/", {
                method: "POST",
                body: formData,
                headers: { "X-CSRFToken": getCSRFToken() },
            })
            .then(response => response.json())
            .then(data => {
                document.getElementById("status").innerText = data.message;
                // Introduce a delay before asking the question
                setTimeout(() => {
                    askQuestion(""); // Call askQuestion without any initial question.
                    let audio = new Audio(data.tts); // play the tts audio file.
                    audio.play();
                }, 2000); // 2000 milliseconds (2 seconds) delay
            })
            .catch(error => console.error("Error:", error));
        }, "image/jpeg");
    }


    // Function to Ask Question
	function askQuestion(question) {
		const context = canvas.getContext("2d");
		const imageData = canvas.toDataURL('image/jpeg'); // get the image data

		canvas.toBlob((blob) => {
			let formData = new FormData();
			formData.append("question", question);
			formData.append("image", blob, "image.jpg");

			fetch("/ask-question/", {
				method: "POST",
				body: formData,
				headers: { "X-CSRFToken": getCSRFToken() },
			})
			.then(response => response.json())
			.then(data => {
				document.getElementById("response").innerText = data.response; // Corrected line
			})
			.catch(error => console.error("Error:", error));
		}, "image/jpeg");
	}


    function getCSRFToken() {
        return document.querySelector('meta[name="csrf-token"]').getAttribute("content");
    }

    function speakText(text) {
        let speech = new SpeechSynthesisUtterance(text);
        speech.lang = "en-US";
        window.speechSynthesis.speak(speech);
    }

    captureBtn.addEventListener("click", captureImage);
</script>

</body>
</html>
